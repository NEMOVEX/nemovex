<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>NEMOVEX GROUP – Developerské projekty</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="NEMOVEX GROUP – moderní developerské projekty, rodinné domy, bytové domy a realizované projekty." />

  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Roboto,Arial,sans-serif}
    body{background:#f4f4f4;color:#222;line-height:1.6;scroll-behavior:smooth}
    a{color:inherit;text-decoration:none}

    /* HEADER */
    header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e0e0e0}
    .nav{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .logo{font-size:18px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
    .logo span{color:#1f7a4f}

    /* Desktop menu */
    nav{display:flex;align-items:center;gap:22px}
    .nav-links{display:flex;align-items:center;gap:22px}
    .nav-links a{
      font-size:13px;font-weight:700;color:#333;position:relative;padding:6px 0;
    }
    .nav-links a::after{
      content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:#1f7a4f;transition:.25s
    }
    .nav-links a:hover::after{width:100%}

    .btn-primary{
      padding:9px 20px;border-radius:999px;border:none;
      background:#1f7a4f;color:#fff;font-weight:800;
      cursor:pointer;display:inline-block;font-size:13px
    }
    .btn-primary:hover{background:#16603d}

    /* HAMBURGER (as button) */
    .hamburger{
      display:none;flex-direction:column;cursor:pointer;gap:4px;
      border:none;background:transparent;padding:8px;border-radius:10px
    }
    .hamburger:focus{outline:none;box-shadow:0 0 0 3px rgba(31,122,79,.18)}
    .hamburger div{width:25px;height:3px;background:#1f7a4f;border-radius:3px}

    /* HERO */
    .hero{
      min-height:72vh;
      background:
        linear-gradient(to right,rgba(0,0,0,.65),rgba(0,0,0,.25)),
        url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2000&q=70') center/cover no-repeat;
      display:flex;align-items:center;color:#fff
    }
    .hero-inner{max-width:1200px;margin:auto;padding:0 20px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px}
    .hero h1{font-size:clamp(36px,5vw,54px);margin-bottom:18px}
    .hero p{max-width:50ch;font-size:16px;margin-bottom:26px}

    .offer-card{
      background:#fff;color:#111;border-radius:20px;
      padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.25)
    }
    .offer-label{text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:#888;margin-bottom:12px}
    .offer-title{font-size:24px;font-weight:900}
    .offer-sub{font-size:14px;color:#555;margin-bottom:16px}
    .offer-grid{display:grid;grid-template-columns:auto auto;gap:10px 20px;font-size:13px}
    .offer-grid span:nth-child(odd){color:#777}

    /* SECTIONS */
    section{padding:70px 20px}
    .container{max-width:1200px;margin:auto}
    .section-title{font-size:26px;margin-bottom:10px}
    .section-sub{font-size:14px;color:#666;margin-bottom:30px}

    /* CARDS */
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
    .card{
      background:#fff;border-radius:16px;overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,.08);
      transition:.25s
    }
    .card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,.12)}
    .card-img{height:180px}
    .card-body{padding:18px}
    .card-body h3{font-size:18px;margin-bottom:6px}
    .card-body p{font-size:13px;color:#666}
    .price{margin:10px 0;font-weight:900}

    /* DETAIL HERO */
    .detail-hero{
      min-height:52vh;color:#fff;
      display:flex;align-items:center
    }
    .detail-hero h2{font-size:42px;margin-bottom:12px}
    .detail-hero p{max-width:75ch}

    /* GALLERY */
    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:16px;
      margin:26px 0 10px;
    }
    .gimg{
      border-radius:16px;overflow:hidden;
      box-shadow:0 10px 24px rgba(0,0,0,.10);
      background:#ddd;height:220px;
    }
    .gimg img{width:100%;height:100%;object-fit:cover;display:block}

    /* INFO BOXES */
    .locations{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:22px}
    .location{
      background:#fff;border-radius:14px;padding:20px;
      box-shadow:0 6px 16px rgba(0,0,0,.06)
    }
