<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>NEMOVEX GROUP – Developerské projekty</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NEMOVEX GROUP – moderní developerské projekty, rodinné domy a rezidenční bydlení v kvalitních lokalitách.">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Roboto,Arial,sans-serif}
body{background:#f4f4f4;color:#222;line-height:1.6;scroll-behavior:smooth}

/* HEADER */
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e0e0e0}
.nav{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:relative}
.logo{font-size:18px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.logo span{color:#1f7a4f}
.nav-links{display:flex;gap:26px;align-items:center}
.nav-links a{text-decoration:none;color:#333;font-size:14px;font-weight:500;position:relative}
.nav-links a::after{
content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:#1f7a4f;transition:.3s}
.nav-links a:hover::after{width:100%}

/* DROPDOWN */
.dropdown{position:relative}
.dropdown-content{
display:none;
position:absolute;
top:36px;
left:0;
background:#fff;
min-width:160px;
box-shadow:0 4px 8px rgba(0,0,0,.1);
border-radius:8px;
overflow:hidden;
z-index:1000;
flex-direction:column}
.dropdown-content a{
padding:10px 16px;
font-size:14px;
border-bottom:1px solid #e0e0e0;color:#333}
.dropdown-content a:last-child{border-bottom:none}
.dropdown:hover .dropdown-content{display:flex}
.dropdown-content a:hover{background:#f4f4f4}

/* BUTTONS */
.btn-primary{
padding:9px 20px;border-radius:999px;border:none;
background:#1f7a4f;color:#fff;font-weight:600;
cursor:pointer;text-decoration:none;display:inline-block}
.btn-primary:hover{background:#16603d}

/* HERO */
.hero{
min-height:70vh;
background:
linear-gradient(to right,rgba(0,0,0,.65),rgba(0,0,0,.25)),
url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c') center/cover no-repeat;
display:flex;align-items:center;color:#fff}
.hero-inner{max-width:1200px;margin:auto;padding:0 20px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px}
.hero h1{font-size:clamp(36px,5vw,54px);margin-bottom:18px}
.hero p{max-width:45ch;font-size:16px;margin-bottom:26px}

/* OFFER CARD */
.offer-card{
background:#fff;color:#111;border-radius:20px;
